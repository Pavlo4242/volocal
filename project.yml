# project.yml — updated for volocal Thai ASR refactor
# Changes:
#   + WhisperKit SPM dependency (Thai / multilingual ASR via CoreML Whisper)
#   All other entries unchanged from original.

name: Volocal

options:
  bundleIdPrefix: com.volocal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  llama.swift:
    url: https://github.com/mattt/llama.swift.git
    from: "1.7130.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: "0.14.5"          # CoreML ASR (Parakeet EOU), TTS (PocketTTS), VAD (Silero)

  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.31.3"        # Apple MLX LLM Common framework

  WhisperKit:                # NEW — Thai + 99-language ASR via CoreML Whisper
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"

  swift-huggingface: 
    url: https://github.com/huggingface/swift-huggingface
    from: "0.9.0"
  swift-transformers: 
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"

targets:
  Volocal:
    type: application
    platform: iOS
    sources:
      - Volocal
    dependencies:
      - package: llama.swift
        product: LlamaSwift
      - package: FluidAudio
        product: FluidAudio
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only (Neural Engine required)
        ENABLE_BITCODE: NO
        OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"   # keep for llama.cpp C interop stability

# NOTE: Physical device only.  The Apple Neural Engine is unavailable in
# the Simulator — FluidAudio models will fail to compile.  Always run on
# a real iPhone 15 or later.
